name: Build unsigned KipAutomate v0.6 APK
on:
  push:
    branches: [kipautomate-unified-v06]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned release APK
        working-directory: KipAutomate
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Stage build and signer for local private signing
        shell: bash
        run: |
          set -e
          mkdir -p release-output
          cp KipAutomate/app/build/outputs/apk/release/app-release-unsigned.apk release-output/KipAutomate-v0.6-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-output/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release-output/zipalign
          sha256sum release-output/*
      - uses: actions/upload-artifact@v4
        with:
          name: KipAutomate-v0.6-unsigned-tools
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
